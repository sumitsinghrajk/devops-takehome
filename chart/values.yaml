replicaCount: 2

image:
  repository: demo-app
  tag: local
  pullPolicy: IfNotPresent

# Port the app listens on; passed to the container as PORT.
containerPort: 8080

config:
  appName: demo
  version: "1.0.0"

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: nginx
  host: demo.local

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
